<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dice3D · 1D16 en 3D (octaedro octogonal)</title>
<style>
  :root { --ink:#1a2340; --muted:#5a6478; --line:#d8deea; --bg:#f8fafc; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; }
  .wrap { width:390px; margin:0 auto; padding:16px 12px 32px; }
  h1 { font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin:0 0 4px; }
  .lede { font-size:13px; color:var(--muted); margin:0 0 16px; }
  section { background:#fff; border:1px solid var(--line); padding:16px; margin-bottom:16px; }
  h2 { font-size:11px; letter-spacing:.14em; text-transform:uppercase; color:#2b5bd7; margin:0 0 14px; }

  /* ── 1D16 REAL como poliedro de 16 caras: octaedro octogonal
     (dos pirámides de 8 caras triangulares = 16 caras exactas).
     Vidrio azul jico, caras traseras visibles, aterrizaje escorado. */
  .stage { display:flex; flex-direction:column; align-items:center; gap:14px; }
  .scene { width:200px; height:200px; perspective:760px; }
  .poly { position:absolute; left:50%; top:50%; width:0; height:0;
          transform-style:preserve-3d; transform:translate(-50%,-50%) rotateX(-14deg) rotateY(20deg);
          transition:transform .9s cubic-bezier(.2,.75,.3,1); }
  .fc { position:absolute; width:46px; height:78px; left:-23px; top:-78px;
        transform-origin:50% 100%;
        background:linear-gradient(180deg, rgba(130,172,252,.5), rgba(64,112,230,.42));
        border:1px solid rgba(255,255,255,.65);
        clip-path:polygon(50% 0, 100% 100%, 0 100%);
        display:flex; justify-content:center; }
  .fc span { margin-top:44px; font-size:12px; font-weight:700; color:rgba(255,255,255,.95);
             text-shadow:0 1px 2px rgba(30,60,140,.5); }
  /* Caras superiores (8) — punta arriba */
  .t0 { transform:rotateY(0deg)   translateZ(55px) rotateX(45deg); }
  .t1 { transform:rotateY(45deg)  translateZ(55px) rotateX(45deg); }
  .t2 { transform:rotateY(90deg)  translateZ(55px) rotateX(45deg); }
  .t3 { transform:rotateY(135deg) translateZ(55px) rotateX(45deg); }
  .t4 { transform:rotateY(180deg) translateZ(55px) rotateX(45deg); }
  .t5 { transform:rotateY(225deg) translateZ(55px) rotateX(45deg); }
  .t6 { transform:rotateY(270deg) translateZ(55px) rotateX(45deg); }
  .t7 { transform:rotateY(315deg) translateZ(55px) rotateX(45deg); }
  /* Caras inferiores (8) — punta abajo, espejadas */
  .fc.b0 span, .fc.b1 span, .fc.b2 span, .fc.b3 span, .fc.b4 span, .fc.b5 span, .fc.b6 span, .fc.b7 span { transform:scaleY(-1); margin-top:30px; }  /* el espejo no invierte el número; en la zona ancha del clip */
  .b0 { transform:rotateY(0deg) translateZ(55px) rotateX(-45deg) scaleY(-1); }
  .b1 { transform:rotateY(45deg) translateZ(55px) rotateX(-45deg) scaleY(-1); }
  .b2 { transform:rotateY(90deg) translateZ(55px) rotateX(-45deg) scaleY(-1); }
  .b3 { transform:rotateY(135deg) translateZ(55px) rotateX(-45deg) scaleY(-1); }
  .b4 { transform:rotateY(180deg) translateZ(55px) rotateX(-45deg) scaleY(-1); }
  .b5 { transform:rotateY(225deg) translateZ(55px) rotateX(-45deg) scaleY(-1); }
  .b6 { transform:rotateY(270deg) translateZ(55px) rotateX(-45deg) scaleY(-1); }
  .b7 { transform:rotateY(315deg) translateZ(55px) rotateX(-45deg) scaleY(-1); }

  .btn { font:600 13px/1 inherit; letter-spacing:.08em; text-transform:uppercase; color:#fff;
         background:#3f6fd8; border:none; padding:11px 18px; cursor:pointer; }
  .btn:hover { background:#3563c6; }
  .btn:focus-visible { outline:3px solid #2b5bd7; outline-offset:2px; }
  .result { font-size:13px; color:var(--muted); min-height:20px; }
  .result b { color:#2b5bd7; font-size:16px; }
  /* Wobble de vuelo: se anima la propiedad `rotate` (compone aparte del
     transform inline) para no pisar la transición de aterrizaje. */
  @keyframes tumble {
    0%   { rotate:0deg; }
    30%  { rotate:-11deg; }
    62%  { rotate:8deg; }
    100% { rotate:0deg; }
  }
  .poly.tumbling { animation:tumble .9s cubic-bezier(.2,.75,.3,1); }
  @media (prefers-reduced-motion: reduce) {
    .poly { transition:none !important; }
    .poly.tumbling { animation:none !important; }
  }
</style>
</head>
<body>
<main class="wrap">
  <h1>Dice3D · 1D16 en 3D</h1>
  <p class="lede">Octaedro octogonal: dos pirámides de 8 caras triangulares = <b>16 caras exactas</b>. Mismo vidrio azul jico y aterrizaje escorado que el d6.</p>

  <section>
    <h2>1 · D16 translúcido — tirar</h2>
    <div class="stage">
      <div class="scene" aria-hidden="true"><div class="poly" id="poly">
        <div class="fc t0"><span>1</span></div><div class="fc t1"><span>2</span></div>
        <div class="fc t2"><span>3</span></div><div class="fc t3"><span>4</span></div>
        <div class="fc t4"><span>5</span></div><div class="fc t5"><span>6</span></div>
        <div class="fc t6"><span>7</span></div><div class="fc t7"><span>8</span></div>
        <div class="fc b0"><span>9</span></div><div class="fc b1"><span>10</span></div>
        <div class="fc b2"><span>11</span></div><div class="fc b3"><span>12</span></div>
        <div class="fc b4"><span>13</span></div><div class="fc b5"><span>14</span></div>
        <div class="fc b6"><span>15</span></div><div class="fc b7"><span>16</span></div>
      </div></div>
      <p class="result" id="res">Pulsa para tirar</p>
      <button class="btn" id="roll">Tirar 1D16</button>
    </div>
  </section>
</main>
<script>
  // Orientación por cara: para que la cara mire a la cámara hay que DESHACER
  // su colocación (rotateY(i*45) … rotateX(±45)) con la composición INVERSA
  // rotateX(∓45) rotateY(-i*45) — el signo del azimuth va negado.
  // Pose final = orientación + escorzo jico + spin acumulativo.
  // Escorzo jico: la separación entre caras del bipirámide es 31.4° (en el cubo
  // d6 son 90°), así que el escorzo se escala en proporción — el mismo look
  // jico (un poco escorado, nunca plano) sin que la cara vecina quede frontal.
  const SKEW = { x:-8, y:12 };
  const faces = {};
  for (let i = 0; i < 8; i++) {
    faces[i + 1]     = { x: -45, y: -i * 45 };       // caras 1-8 (pirámide superior)
    faces[i + 9]     = { x: 45, y: -i * 45 };        // caras 9-16 (pirámide inferior)
  }
  let spinX = 0, spinY = 0, done = null;
  const poly = document.getElementById('poly'), res = document.getElementById('res');
  document.getElementById('roll').onclick = () => {
    const v = 1 + Math.floor(Math.random() * 16);
    res.textContent = 'Tirando…';
    spinX += 360; spinY += 720;
    poly.style.transform = 'translate(-50%,-50%) rotateX(' + (faces[v].x + spinX + SKEW.x) + 'deg) rotateY(' + (faces[v].y + spinY + SKEW.y) + 'deg)';
    // Wobble de vuelo (reinicia la keyframe aunque la tirada sea rápida).
    poly.classList.remove('tumbling'); void poly.offsetWidth; poly.classList.add('tumbling');
    const reveal = () => { res.innerHTML = 'Resultado: <b>' + v + '</b>'; };
    if (done) { poly.removeEventListener('transitionend', done); done = null; }
    if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
      reveal(); // sin transición no hay transitionend: el resultado sale al instante
    } else {
      done = (e) => {
        if (e.target !== poly || e.propertyName !== 'transform') return;
        reveal(); poly.removeEventListener('transitionend', done); done = null;
      };
      poly.addEventListener('transitionend', done);
    }
  };
</script>
</body>
</html>
