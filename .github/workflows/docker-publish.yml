name: Docker Publish

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # PrismaClient is generated into node_modules/.prisma — required before
      # the unit tests (lib/prisma.test.ts) and the build can run.
      - run: pnpm db:generate
      - run: pnpm test
      - run: pnpm lint
      # `pnpm build` is the ONLY gate that runs the production type-check —
      # neither `pnpm test` nor `pnpm lint` invoke tsc. Without this step a
      # broken build can merge behind a green Test check (it happened once).
      - run: pnpm build

  # Local e2e gate (AUTH_MODE=local): no Postgres and no secrets required.
  # Runs in parallel with `test` so the wall-clock cost is only the slower of
  # the two. Without this job CI never executes Playwright, so a broken flow
  # surfaces at the next manual QA instead of on the PR (#271).
  e2e:
    name: E2E (local)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `next dev` imports the generated Prisma client even in local mode.
      - run: pnpm db:generate
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      # A red run without evidence is undiagnosable; keep the HTML report
      # (traces included) only when something failed.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Real-DB auth suite (71 specs) against Postgres. Same shape as the job above,
  # but this is the one that covers the journeys users actually run — signup,
  # league lifecycle, live match, resolution. It only became gateable once the
  # suite went green (#297 rate-limit, #270, #300, #301), which is precisely the
  # gap #271 opened: a broken flow used to surface at the next manual QA.
  e2e-auth:
    name: E2E (auth)
    runs-on: ubuntu-latest
    env:
      # `docker compose up -d postgres` (inside `pnpm run test:e2e:auth`)
      # interpolates the WHOLE compose file, and the `web` service declares
      # `AUTH_SECRET: ${AUTH_SECRET:?...}` — without a value compose refuses to
      # load the file at all, so even starting only `postgres` needs it. The
      # app never reads this: playwright.config.auth.ts supplies its own test
      # secret to the dev server.
      AUTH_SECRET: ci-e2e-auth-secret-for-tests-only
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 8.6.6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm exec playwright install --with-deps chromium
      # Starts compose Postgres on 127.0.0.1:5433, waits for `pg_isready`,
      # applies the schema, then boots `next dev` in AUTH_MODE=auth.
      - run: pnpm run test:e2e:auth
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-auth
          path: playwright-report-auth/
          if-no-files-found: ignore
          retention-days: 7

  docker:
    name: Docker Image
    needs: [test, e2e, e2e-auth]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute GHCR image name
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Compute readable version tag
        id: version
        run: |
          # Monotonic, human-readable tag: <YYYY.MM.DD>-<run number>, e.g. 2026.08.11-3.
          echo "tag=$(date -u +%Y.%m.%d)-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.meta.outputs.image }}:latest
            ${{ steps.meta.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
