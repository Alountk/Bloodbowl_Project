# Blood Bowl Web — runs the latest published image from GHCR.
# Usage: docker compose up -d
# `pull_policy: always` ensures every up pulls the newest `latest` image.
#
# Connectivity: the web reaches postgres via `host.docker.internal:5432`
# (resolved to the host gateway). This works even when the orchestrator
# isolates per-service networks and `postgres` as a DNS name is not available.
# If your orchestrator DOES share a network (plain docker compose), you can
# switch DATABASE_URL back to `@postgres:5432` and drop the extra_hosts.
services:
  web:
    image: ghcr.io/alountk/bloodbowl_project:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3444:3444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Full control from the environment: set DATABASE_URL in the .env when you
      # need a custom connection string. Falls back to the standard local
      # postgres on the published port when DATABASE_URL is unset.
      DATABASE_URL: ${DATABASE_URL:-postgresql://bloodbowl:bloodbowl@host.docker.internal:5433/bloodbowl?schema=public}
      # Required for Auth.js on a LAN/HTTP host. Override in production with the
      # real session secret; do NOT commit a production value.
      AUTH_SECRET: ${AUTH_SECRET:-}
      AUTH_TRUST_HOST: "true"
      # `auth` enforces login + Postgres persistence. Production MUST stay `auth`.
      AUTH_MODE: ${AUTH_MODE:-auth}
    networks:
      - arcane_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bloodbowl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloodbowl}
      POSTGRES_DB: ${POSTGRES_DB:-bloodbowl}
    ports:
      # Published port is configurable; the default 5433 avoids the common 5432
      # clash with other Postgres instances on the same host.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bloodbowl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloodbowl} -d ${POSTGRES_DB:-bloodbowl}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - arcane_net

networks:
  # Shared bridge so web can reach postgres by hostname. If the orchestrator
  # already manages a network with this name, switch to `external: true`.
  # NOTE: even if this network is ignored, host.docker.internal keeps working.
  arcane_net:
    driver: bridge

volumes:
  bloodbowl_postgres_data:
