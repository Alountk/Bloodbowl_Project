# Blood Bowl Web — Dokploy deployment from the published GHCR images.
# Usage: Dokploy `docker compose up -d` (or local `docker compose up -d` on a
# host running Dokploy). `pull_policy: always` ensures every deploy pulls the
# newest `latest` / `:migrate` images.
#
# Services: `migrate` (one-shot `prisma migrate deploy`, tag `:migrate`) runs to
# completion before `web` starts, then `postgres`.
#
# Dokploy/Traefik routing: `web` publishes NO host port — Traefik reaches it
# over the external `dokploy-network`. Configure the Dokploy domain target port
# as 3444 (the container's `ENV PORT`), not Dokploy's default 3000.
# `postgres` is intentionally unpublished: it is only reachable in-network.
services:
  # One-shot migrations: `prisma migrate deploy` against the same DATABASE_URL
  # as `web`, then exits 0. `restart: "no"` + `web.depends_on:
  # condition: service_completed_successfully` means every deploy applies
  # migrations before the server starts.
  migrate:
    image: ghcr.io/alountk/bloodbowl_project:migrate
    pull_policy: always
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bloodbowl:bloodbowl@postgres:5432/bloodbowl?schema=public}
    networks:
      - arcane_net

  web:
    image: ghcr.io/alountk/bloodbowl_project:latest
    pull_policy: always
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://bloodbowl:bloodbowl@postgres:5432/bloodbowl?schema=public}
      # Required for Auth.js behind the Traefik HTTPS proxy; compose fails fast
      # without it. Generate with: openssl rand -base64 32
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — generate with `openssl rand -base64 32`}
      # true lets Auth.js trust Traefik's x-forwarded-* headers.
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      # `auth` enforces login + Postgres persistence. Production MUST stay `auth`.
      AUTH_MODE: ${AUTH_MODE:-auth}
      # Structured logging level (lib/logger.ts): debug | info | warn | error.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Public base URL (https://<domain>), used for absolute links in emails.
      APP_URL: ${APP_URL:-}
      # Email delivery (Resend HTTP API); unset degrades to console transport.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    # Persist locally-stored avatars across container recreation (the S3 driver
    # is the durable path for real deployments).
    volumes:
      - web_uploads:/app/public/uploads
    networks:
      - arcane_net
      - dokploy-network

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Override in Dokploy's environment on any shared host (defaults are for
      # the local stack only).
      POSTGRES_USER: ${POSTGRES_USER:-bloodbowl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloodbowl}
      POSTGRES_DB: ${POSTGRES_DB:-bloodbowl}
    volumes:
      - bloodbowl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloodbowl} -d ${POSTGRES_DB:-bloodbowl}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - arcane_net

networks:
  # Internal bridge: web reaches postgres by service name.
  arcane_net:
    driver: bridge
  # Created by Dokploy; Traefik attaches here to route to `web`.
  dokploy-network:
    external: true

volumes:
  bloodbowl_postgres_data:
  # Persistent store for locally-stored avatars (/app/public/uploads).
  web_uploads:
