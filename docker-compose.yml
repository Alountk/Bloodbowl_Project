# Blood Bowl Web — runs the latest published image from GHCR.
# Usage: docker compose up -d
# `pull_policy: always` ensures every up pulls the newest `latest` image.
#
# Connectivity: BOTH services live in this stack and share `arcane_net`, so the
# web reaches postgres by its SERVICE NAME — no host hop, no published port
# involved, and no dependency on how the host resolves `host.docker.internal`
# (on a Linux Engine that alias is a bridge address, which cannot reach a
# loopback-bound publish; on Docker Desktop it happens to work — see issue #308).
# `extra_hosts` below stays as the escape hatch for a DATABASE_URL override that
# deliberately targets the host instead.
services:
  web:
    image: ghcr.io/alountk/bloodbowl_project:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "3444:3444"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Full control from the environment: set DATABASE_URL in the .env when you
      # need a custom connection string. Unset, it falls back to the `postgres`
      # service of THIS stack (in-network, port 5432 inside the container — the
      # host-published port below is irrelevant to the web).
      DATABASE_URL: ${DATABASE_URL:-postgresql://bloodbowl:bloodbowl@postgres:5432/bloodbowl?schema=public}
      # Required for Auth.js on a LAN/HTTP host. Override in production with the
      # real session secret; the `:?` makes compose fail fast without it.
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET is required — generate with `openssl rand -base64 32`}
      # Env-driven so production can set "false" behind HTTPS; default "true"
      # preserves the LAN/HTTP Arcane deploy.
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      # `auth` enforces login + Postgres persistence. Production MUST stay `auth`.
      AUTH_MODE: ${AUTH_MODE:-auth}
      # Structured logging level (lib/logger.ts): debug | info | warn | error.
      # Logs are JSON lines on stdout, queryable with `docker logs <c> | jq`.
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Public base URL, used to build absolute links inside notification emails.
      APP_URL: ${APP_URL:-}
      # Email delivery (Resend HTTP API). When either is unset the app falls back
      # to a console transport that logs the message instead of sending it, so a
      # missing credential degrades to "no email", never to a broken request.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}
    # Persist locally-stored avatars across container recreation. The local
    # driver writes under `public/uploads`; a named volume keeps those files out
    # of the ephemeral container layer (and survives the image being replaced).
    # The S3 driver is the durable path for real deployments.
    volumes:
      - web_uploads:/app/public/uploads
    networks:
      - arcane_net

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      # Set a strong password in .env on any shared host (defaults are for the
      # local stack only). The published port is loopback-bound above.
      POSTGRES_USER: ${POSTGRES_USER:-bloodbowl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bloodbowl}
      POSTGRES_DB: ${POSTGRES_DB:-bloodbowl}
    ports:
      # Published port is configurable; the default 5433 avoids the common 5432
      # clash with other Postgres instances on the same host. Bound to
      # loopback so a LAN peer cannot reach Postgres with the default creds.
      # This publish is ONLY for the host (psql on the box) — the web service
      # never uses it: it talks to `postgres:5432` over `arcane_net` above.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - bloodbowl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bloodbowl} -d ${POSTGRES_DB:-bloodbowl}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - arcane_net

networks:
  # Shared bridge so web can reach postgres by hostname. If the orchestrator
  # already manages a network with this name, switch to `external: true`.
  # NOTE: even if this network is ignored, host.docker.internal keeps working.
  arcane_net:
    driver: bridge

volumes:
  bloodbowl_postgres_data:
  # Persistent store for locally-stored avatars (mounted at
  # /app/public/uploads on the web service).
  web_uploads:
